# EduLearn SLA configuration
# Each line: METHOD<SP>PATH_PATTERN<SP>BUDGET_MS<SP>SEVERITY
#   METHOD: GET | POST | PUT | DELETE | ANY
#   PATH_PATTERN: prefix match; `*` is a segment wildcard
#   BUDGET_MS: integer milliseconds (upper bound; single-sample wall-clock)
#   SEVERITY: HARD (PRD-mandated — failing violates build)
#             WARN (team baseline — violations reported only)
#
# Ordering: first match wins. Put specific rules above generic ones.

# ─── PRD Section 11 (Non-Functional Requirements) — HARD ─────────────
POST    /api/enrollment/enroll          2000    HARD
DELETE  /api/enrollment/*/drop          2000    HARD
POST    /api/submissions/*/grade        2000    HARD

# ─── Team-defined baselines — WARN ───────────────────────────────────
# Auth is BCrypt-bound at register; login is BCrypt.Verify — both slow.
POST    /api/auth/register              1000    WARN
POST    /api/auth/login                  800    WARN

# Reads
GET     /api/health                      100    WARN
GET     /api/*/unread-count              150    WARN
GET     /api/*/*                         250    WARN
GET     /api/*                           500    WARN

# Writes
POST    /api/*                           750    WARN
PUT     /api/*                           750    WARN
DELETE  /api/*                           500    WARN

# Catch-all
ANY     /*                              1500    WARN
